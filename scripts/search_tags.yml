# Search synonyms, one list per page under book/.
#
# scripts/site_hooks.py reads this file and sets each page's `tags`, which
# Material's search plugin indexes as a third field. The tags are not rendered:
# nothing about the page changes, on the site or on GitHub, which is why they
# live here rather than as front matter in the book - book/ stays the files
# GitHub shows, with nothing generated in them (CLAUDE.md), exactly as the nav
# already comes from book/README.md rather than from fifty front-matter blocks.
#
# Why the field exists at all: the index weights a title a thousand times a
# word in the body, and this book's chapter titles are deliberately literary -
# *Still Live at Unload*, *The Bridge Out*, *No Repro, Dump Attached*. That is
# right for a reading order and useless to a reader who arrives sideways,
# mid-task, typing what is on their screen. Tags are where the words they
# actually type live.
#
# FOUR RULES, each learned by measuring against scripts/search_queries.tsv:
#
# 1. Tags apply to EVERY SECTION of the page, so a tag must name the whole
#    page's subject. Appendix F is 49 unrelated recipes and gets only the
#    words that mean "the cookbook"; its recipes are found by the C# API in
#    their own text, which is what a recipe opens with.
#
# 2. A tag outweighs a title by a thousand and a body word by a million, so a
#    tag that is a common word HIJACKS every query containing it. `task`,
#    `file`, `code`, `build`, `value` are not tags. Distinctive tokens only.
#
# 3. Tags are tokenized like everything else, on the separator in mkdocs.yml.
#    `std::forward` is not a tag - it becomes `std` and `forward`, and `std`
#    on one page would win every `std::anything` query in the book.
#
# 4. EVERY term the reader types matches as a prefix - Material appends the
#    wildcard to all of them, not only the last, which is the thing to get
#    wrong here. So a tag answers every query whose word it starts with:
#    `forwarding` answers `forward` and `std::forward` alike, and `containers`
#    would answer `contain`. Prefer the word the reader types over a longer
#    one, and check the fixture after adding any tag - a tag that helps one
#    query and breaks another is the normal case, not the surprise.
#
# 5. A tag is reachable by any query word it starts with, so a one- or
#    two-letter word in a typed sentence - the `I` in "which container should
#    I use" - matches `interfaces`, `iterators`, `interop` and every other
#    tag beginning with it, each weighted a million. Nothing prevents that;
#    it is why the fixture keeps short, realistic queries rather than
#    sentences, and why a new tag is worth a thought about its first letters.
#
# Every page under book/ must be listed; the hook fails the build otherwise,
# the same rule the nav already enforces. An empty list is a decision, so it
# carries the reason.

