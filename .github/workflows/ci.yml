name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The repo invariant: every solution compiles and runs clean under
      # -Wall -Wextra -fsanitize=address,undefined. Must print ALL GREEN.
      # --require-cmake: the script's six cmake steps - Chapter 27's deplab,
      # Chapter 26's CMakeLists, configured, built and run three ways, and its
      # skeleton through its presets, Chapter 40's pluginlab, and Appendix J's
      # rpathlab and cookbook project - SKIP on a machine without cmake, which is right on a laptop and very wrong here.
      # Both hosted images ship cmake, so the flag only ever fires if that
      # changes.
      # --require-git: deplab's FetchContent path needs a git that can clone a
      # file:// repository, and that is the only check proving the TAG selects
      # the version rather than merely that two builds differ. git present but
      # refusing file:// (protocol.file.allow) would skip it silently.
      # --require-tsan: same bargain for the ThreadSanitizer build of
      # Chapter 29's lab. That one is the reason this job matters most on
      # ubuntu - LeakSanitizer is unsupported on macOS/arm64, so only the
      # Linux leg can say anything about the callback contexts the chapter
      # deliberately never frees inside the destructor.
      # --require-expected: the one C++23 listing in the cookbook (Recipe 22's
      # std::expected) is built behind a probe, and a probe that skips in CI
      # is a listing nobody checks. Both hosted images ship a compiler with
      # <expected>; the flag exists so a runner image that stops doing so
      # fails loudly rather than skipping quietly.
      # --require-cargo: Appendix F's Rust tab is a crate under
      # exercises/cookbook/rust/, tested offline with warnings as errors; both
      # hosted images ship cargo, and a tab CI never tests is a listing nobody
      # checks.
      # --require-openssl: Recipes 36-37 link the system's libcrypto through
      # pkg-config; on macOS the runner's OpenSSL is keg-only, so the path is
      # pointed at it first. SKIPPED on a laptop without it; never here.
      # --require-curl: Recipe 41 links the system's libcurl the same way. The
      # macOS SDK ships it and Homebrew's pkg-config shim answers for it (the
      # keg-only curl is added to the path as a fallback); Ubuntu needs the
      # -dev package, installed here. Its judge is a file:// fixture and a
      # loopback server, so no network is involved.
      # --require-sqlite: Recipe 42 links the system's sqlite3 the same way
      # (the SDK ships it on macOS; libsqlite3-dev on Ubuntu). Its judge is
      # an in-memory database.
      # locale-gen de_DE.UTF-8: Chapter 42's judge switches LC_NUMERIC to a
      # German locale to prove the number parse asks none; macOS ships the
      # locale and a stock Ubuntu image does not, so without this line the
      # Linux leg would skip the one row that tells from_chars from strtod.
      - run: |
          if [ "$(uname -s)" = Darwin ]; then export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"; fi
          if [ "$(uname -s)" = Darwin ] && ! pkg-config --exists libcurl; then export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"; fi
          if [ "$(uname -s)" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev libsqlite3-dev pkg-config && sudo locale-gen de_DE.UTF-8; fi
          ./scripts/build_all.sh --require-cmake --require-git --require-tsan --require-expected --require-openssl --require-curl --require-sqlite --require-cargo

  # Chapter 26's root files, held to their own tools. exercises/skeleton/ is
  # the one directory the repository formats by machine - the labs keep
  # hand-aligned trailing comments the tool would fold - so clang-format
  # --dry-run --Werror runs over it, then clang-tidy against the compile
  # database, names included (.clang-tidy turns readability-identifier-naming
  # and bugprone-reserved-identifier into errors). The labs are not
  # formatted because their layout - one-line structs, aligned comments, a
  # short body on the line that declares it - is what the chapters quote. Both tools are pinned by
  # version through pip, because clang-format's idea of Google style moves
  # between major versions and a format check must agree with the machine
  # that formatted the files. And a negative test, because a style check
  # that cannot fail is not a check: a reserved identifier, written into the
  # header and the source, must be refused and named.
  skeleton-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install clang-format==23.1.0 clang-tidy==22.1.8
      - run: |
          cd exercises/skeleton
          clang-format --version
          clang-format --dry-run --Werror src/*.cpp include/myplugin/*.h tests/*.cpp
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Debug > /dev/null
          clang-tidy --version
          clang-tidy -p build/ci src/session.cpp tests/session_test.cpp
      - run: |
          cd exercises/skeleton
          sed -i 's/count_/_Count/g' include/myplugin/session.h src/session.cpp
          if clang-tidy -p build/ci src/session.cpp > tidy.log 2>&1; then
            echo "FAIL: clang-tidy accepted a reserved identifier"; cat tidy.log; exit 1
          fi
          # Two statements, not one && list: under bash -e a failing command
          # inside && is ignored unless it is the last, and both must hold.
          grep -q "reserved-identifier" tidy.log
          grep -q "identifier-naming" tidy.log
          echo "refused, and named both checks"
          git checkout -- .

  # The book states sanitizer behavior that differs between the maintainer's
  # macOS/arm64 machine and Linux - exit codes, leak detection, whether a frame
  # carries a column number - and an audit found several places where one
  # platform's behavior had been written down as the rule. The corrections cite
  # compiler-rt documentation for the Linux half because there was no Linux to
  # run them on. This job is that Linux, and macOS alongside it so the contrast
  # is asserted from both ends rather than assumed from one.
  platform-claims:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Chapter 31 claims columns come from llvm-symbolizer specifically. Without
      # it the runtime falls back to addr2line and prints none, which would be a
      # fact about the runner rather than a counter-example - so the script skips
      # that check, and --required turns any skip into a failure. Guarantee the
      # tool instead of discovering it is missing as a red X.
      - name: Ensure llvm-symbolizer
        if: runner.os == 'Linux'
        run: |
          if ! command -v llvm-symbolizer > /dev/null; then
            sym=$(ls /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$sym" ]; then
              sudo ln -s "$sym" /usr/local/bin/llvm-symbolizer
            else
              sudo apt-get update && sudo apt-get install -y llvm
            fi
          fi
          llvm-symbolizer --version
      # --required: the script SKIPS a check whose tool is missing, which is
      # right on a laptop and very wrong here - a skipped check that reads as a
      # pass is exactly how the wrong claims survived the first time.
      - run: ./scripts/check_platform_claims.sh --required

  # The job above runs the Greeter CMakeLists on two Unix compilers and never
  # touches its `if(MSVC)` branches, which is how untested code gets into a
  # book. This job configures and builds the same file with MSVC, both ways -
  # build_all.sh is a bash script that wants g++, so it is not the thing to run
  # here - and then checks the one other claim in the book that rests on an
  # MSVC default rather than on the standard.
  buildlab-msvc:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash          # -e, so a failing line fails the step
    steps:
      - uses: actions/checkout@v5
      # No -G: the point is the generator a Windows reader actually gets, which
      # is the Visual Studio one. It is multi-config, so CMAKE_BUILD_TYPE is
      # ignored and the configuration is chosen at build time - the commands
      # below are the chapter's with that one difference, which is the whole
      # reason to run them here.
      - name: Default configuration
        run: |
          cmake -S exercises/buildlab -B build/msvc
          cmake --build build/msvc --config Debug
          ./build/msvc/Debug/greet.exe
      # The instrumented binary needs clang_rt.asan_dynamic-x86_64.dll at
      # startup, and MSVC ships it next to cl.exe rather than in System32: run
      # the exe from a plain shell and it dies before main() with no message
      # worth reading (exit 127 here). A Developer Command Prompt has that
      # directory on PATH already; this job has to put it there itself.
      - name: GREETER_SANITIZE=ON
        run: |
          cmake -S exercises/buildlab -B build/msvc-asan -DGREETER_SANITIZE=ON
          cmake --build build/msvc-asan --config Debug
          asan_dll=$(ls "/c/Program Files/Microsoft Visual Studio"/*/*/VC/Tools/MSVC/*/bin/Hostx64/x64/clang_rt.asan_dynamic-x86_64.dll | tail -1)
          PATH="$(dirname "$asan_dll"):$PATH" ./build/msvc-asan/Debug/greet.exe
      # Chapter 26's tree as a directory (exercises/skeleton/): its MSVC
      # branches are the same shape as buildlab's, and a branch nothing builds
      # is a branch nobody is checking. Built under Visual Studio with the
      # sanitizer on and its test run through CTest, the ASan runtime on PATH
      # as above; the dev preset is not used here because a multi-config
      # generator ignores the CMAKE_BUILD_TYPE it pins.
      - name: Skeleton (MYPLUGIN_SANITIZE=ON)
        run: |
          cmake -S exercises/skeleton -B build/msvc-skeleton -DMYPLUGIN_SANITIZE=ON
          cmake --build build/msvc-skeleton --config Debug
          asan_dll=$(ls "/c/Program Files/Microsoft Visual Studio"/*/*/VC/Tools/MSVC/*/bin/Hostx64/x64/clang_rt.asan_dynamic-x86_64.dll | tail -1)
          PATH="$(dirname "$asan_dll"):$PATH" ctest --test-dir build/msvc-skeleton -C Debug --output-on-failure

      # cl is not on PATH in this shell; the steps above never needed it because
      # cmake locates the toolchain itself. Deliberately placed AFTER them, so
      # putting the compiler on PATH cannot change which generator or compiler
      # those two steps pick up.
      - uses: ilammy/msvc-dev-cmd@v1

      # Chapter 14 tells the reader that `cl /std:c++17 /W4 /EHsc` - the exact
      # line in tracer.cpp's own header - does not perform NRVO, so an extra
      # move-construction appears in the RVO section that clang and GCC never
      # print, shifting every #id after it by one. That rests entirely on a
      # Microsoft default (/Zc:nrvo is off unless /O2, /permissive- or
      # /std:c++20 turns it on), and a vendor default is the kind of fact that
      # changes under a book without telling anyone. Assert both halves: the
      # documented line shows the move, and /Zc:nrvo elides it. If Microsoft
      # ever flips the default, the first assertion fails and names the chapter.
      - name: Chapter 14's /Zc:nrvo claim
        env:
          # Git Bash rewrites arguments that look like paths, which would mangle
          # every /flag below into a C:/... directory.
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          # The chapter's claim is about the RVO section specifically; the rest
          # of the program move-constructs all over the place on every compiler.
          moves_in_rvo_section() {
            tr -d '\r' < "$1" | sed -n '/--- RVO ---/,/--- vector ---/p' \
              | grep -c "move-CONSTRUCTED" || true
          }
          cl /nologo /std:c++17 /W4 /EHsc solutions/tracer.cpp /Fe:tracer_default.exe
          ./tracer_default.exe > default.log
          cl /nologo /std:c++17 /W4 /EHsc /Zc:nrvo solutions/tracer.cpp /Fe:tracer_nrvo.exe
          ./tracer_nrvo.exe > nrvo.log
          d=$(moves_in_rvo_section default.log)
          n=$(moves_in_rvo_section nrvo.log)
          echo "move-constructions in the RVO section: default=$d, /Zc:nrvo=$n"
          sed -n '/--- RVO ---/,/--- vector ---/p' default.log
          [ "$d" = 1 ] || { echo "FAIL: Chapter 14 says the documented cl line shows exactly one extra move-construction here; saw $d"; exit 1; }
          [ "$n" = 0 ] || { echo "FAIL: /Zc:nrvo should elide it entirely; saw $n"; exit 1; }

      # Appendix K's first claim rests on the same kind of fact: MSVC reports
      # __cplusplus as 199711 unless /Zc:__cplusplus is passed, and _MSVC_LANG
      # carries the honest value either way. Both readings asserted, from the
      # probe's own output, so a changed default names the appendix.
      - name: Appendix K's /Zc:__cplusplus claim
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          reading() { tr -d '\r' < "$1" | grep -E "^$2 " | awk '{print $2}'; }
          cl /nologo /std:c++17 /W4 /EHsc exercises/cookbook/standard.cpp /Fe:standard_default.exe
          ./standard_default.exe > standard_default.log
          cl /nologo /std:c++17 /W4 /EHsc /Zc:__cplusplus exercises/cookbook/standard.cpp /Fe:standard_zc.exe
          ./standard_zc.exe > standard_zc.log
          echo "default: __cplusplus=$(reading standard_default.log __cplusplus) _MSVC_LANG=$(reading standard_default.log _MSVC_LANG)"
          echo "/Zc:__cplusplus: __cplusplus=$(reading standard_zc.log __cplusplus)"
          [ "$(reading standard_default.log __cplusplus)" = 199711 ] || { echo "FAIL: Appendix K says MSVC reports __cplusplus as 199711 by default"; exit 1; }
          [ "$(reading standard_default.log _MSVC_LANG)" = 201703 ] || { echo "FAIL: _MSVC_LANG should carry the real standard regardless"; exit 1; }
          [ "$(reading standard_zc.log __cplusplus)" = 201703 ] || { echo "FAIL: /Zc:__cplusplus should make __cplusplus honest"; exit 1; }

      # Chapter 40's lab under Visual Studio: the SDK drop installed, the
      # MODULE built against the prefix, the host loading it both ways - and
      # the one line in that lab only Windows can check,
      # CMAKE_MSVC_RUNTIME_LIBRARY: dumpbin /dependents must list ucrtbased.dll,
      # the debug runtime a Debug plug-in has to share with a Debug host (the
      # value is MSVC's default too, so this holds the value, not the line).
      # dumpbin reads the export table back the way nm does on the Unix legs;
      # it is on PATH here because msvc-dev-cmd ran just above.
      - name: Chapter 40's pluginlab
        run: |
          cmake -S exercises/pluginlab/sdk -B build/pl-sdk -DCMAKE_INSTALL_PREFIX="$(pwd -W)/build/pl-prefix"
          cmake --build build/pl-sdk --config Debug
          cmake --install build/pl-sdk --config Debug
          cmake -S exercises/pluginlab/plugin -B build/pl-plugin -DCMAKE_PREFIX_PATH="$(pwd -W)/build/pl-prefix"
          cmake --build build/pl-plugin --config Debug
          cmake -S exercises/pluginlab/host -B build/pl-host -DCMAKE_PREFIX_PATH="$(pwd -W)/build/pl-prefix"
          cmake --build build/pl-host --config Debug
          ./build/pl-host/Debug/host.exe build/pl-plugin/Debug/monitor.dll | tee host.log
          grep -q 'monitor loaded against hostsdk' host.log
          ./build/pl-host/Debug/host.exe build/pl-plugin/Debug/monitor.dll --older | tee older.log || true
          grep -q 'plug-in returned -1' older.log
          MSYS_NO_PATHCONV=1 dumpbin /dependents build/pl-plugin/Debug/monitor.dll | tee deps.log
          grep -qi 'ucrtbased.dll' deps.log || { echo "FAIL: a Debug monitor.dll should depend on the debug CRT - CMAKE_MSVC_RUNTIME_LIBRARY"; exit 1; }
          MSYS_NO_PATHCONV=1 dumpbin /exports build/pl-plugin/Debug/monitor.dll | tee exports.log
          [ "$(grep -c 'Plugin_Entry' exports.log)" = 1 ] || { echo "FAIL: monitor.dll should export exactly one Plugin_Entry"; exit 1; }
          ! grep -q 'HostSdk_VersionString\|Describe' exports.log || { echo "FAIL: monitor.dll exports a symbol that should be hidden"; exit 1; }

      # scripts/check.ps1 is the Windows mirror of check.sh, and the TASK cards
      # point Windows readers at it - so it gets the same treatment as every
      # other claim: exercised here, where a Developer-shell PATH (msvc-dev-cmd
      # above) provides cl.exe and the ASan runtime, so it cannot rot unnoticed.
      # One plain build, one through the vendor-code path, and one in the
      # ticket labs' multi-TU form - two sources plus a run argument, so the
      # source-list parsing AND the run-args boundary are both exercised.
      # The if-guards are pwsh's spelling of bash's -e: a pwsh step only
      # propagates the LAST line's exit code, so without them a failure in an
      # earlier line would pass unnoticed.
      - name: check.ps1 smoke test
        shell: pwsh
        run: |
          Set-Content smoke.cpp "#include <cstdio>`nint main() { std::puts(`"hi`"); return 0; }"
          ./scripts/check.ps1 smoke.cpp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/check.ps1 solutions/fakesdk_solution.cpp fakesdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/check.ps1 exercises/reportlab/registry.cpp exercises/reportlab/main.cpp 100
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Recipe 29's gmtime_s branch is compiled by no other job: the MS
          # signature's argument order is the reverse of C11 Annex K's, which
          # is why the _WIN32 guard exists and why it needs a Windows build.
          ./scripts/check.ps1 exercises/cookbook/timing.cpp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Recipe 10's u8path round trip is asserted only under _WIN32: it is
          # the one platform where a path is wchar_t and the plain constructor
          # reads a std::string in the process's code page rather than as UTF-8.
          ./scripts/check.ps1 exercises/cookbook/paths.cpp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Recipe 38's rename-over-existing is a MoveFileEx here: the recipe
          # describes Windows behaviour, so it runs on Windows.
          ./scripts/check.ps1 exercises/cookbook/files.cpp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Recipe 43's Win32 half - CreateFileMapping and MapViewOfFile - is
          # compiled by no other job. On this platform the harness maps one
          # object twice in one process; the cross-process half is the
          # POSIX legs' fork, and the recipe says so.
          ./scripts/check.ps1 exercises/cookbook/shm.cpp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The SAN/OPT knobs, which Chapter 27's steps 5 and 6 need. Untested
          # they are worse than absent: a reader following the card would get a
          # build that quietly still had the sanitizer in it, and step 6's
          # answer with it. Assert the flags rather than just the exit code -
          # "it built" cannot tell /Od from /O2, or ASan present from absent.
          $env:SAN = 'none'; $env:OPT = '2'
          # 6>&1: check.ps1 reports through Write-Host, which is the information
          # stream, and a plain assignment would capture none of it - the
          # assertions below would then "pass" against an empty string.
          $out = ./scripts/check.ps1 smoke.cpp 6>&1 | Out-String
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($out -match 'fsanitize') { throw "SAN=none still passed /fsanitize: $out" }
          if ($out -notmatch '/O2')    { throw "OPT=2 did not reach the flags: $out" }
          if ($out -notmatch 'NO sanitizer was built in') { throw "SAN=none kept the ASan-quiet claim: $out" }
          Remove-Item Env:\SAN, Env:\OPT
          # ...and that the default is unchanged by all of the above.
          $out = ./scripts/check.ps1 smoke.cpp 6>&1 | Out-String
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($out -notmatch 'fsanitize=address') { throw "default lost the sanitizer: $out" }
          if ($out -notmatch '/Od') { throw "default lost /Od: $out" }

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Alerts, mermaid fences and horizontal rules render on GitHub only in a
      # particular shape, and every way of getting it wrong is silent: no build
      # error, no broken link, and a diff that looks fine. Cannot check mermaid
      # grammar - see the script's header.
      - run: ./scripts/check_markup.sh
      # Code the book quotes must equal the code the repo ships. The same-commit
      # discipline failed silently once (tracer.cpp's Finding labels drifted);
      # now it is enforced, not trusted.
      - run: ./scripts/check_verbatim.sh
      # check_markup.sh checks the fence; this checks what is inside it, by
      # drawing every diagram with a real mermaid. Pinned to the major version
      # GitHub itself renders with, so a green run here means what it looks
      # like it means. This install is the slow step in an otherwise ~10s job.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @mermaid-js/mermaid-cli@11
      # --required: without it the script SKIPS when mmdc is missing, which is
      # right on a laptop with no Node and very wrong in CI.
      - run: ./scripts/check_mermaid.sh --required
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline checks relative links and nothing else, so a flaky
          # external site can never fail CI; --include-fragments makes the
          # #chapter-N--title anchors blocking too. The glob picks up every
          # markdown file in the repo. The site job is the second checker of
          # the same links, through a different parser.
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The book as a static site, over the unchanged book/ files - see
      # SITE-PLAN.md. --strict (inside the script) makes this a second,
      # independent link-and-anchor check beside lychee, with two things
      # lychee cannot see: a page the nav does not know, and an include
      # (--8<--) whose file or section does not exist. mermaid-cli is
      # installed so the diagrams are rendered at build time here exactly as
      # the Pages workflow renders them, and the guard after the build says
      # so: no page may still carry a fence for the browser to render.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @mermaid-js/mermaid-cli@11
      - run: ./scripts/build_site.sh
      - run: test -f build/site/index.html
      - run: '! grep -rl "language-mermaid\|class=\"mermaid\"" build/site --include=*.html'
