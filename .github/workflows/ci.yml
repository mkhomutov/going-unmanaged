name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The repo invariant: every solution compiles and runs clean under
      # -Wall -Wextra -fsanitize=address,undefined. Must print ALL GREEN.
      - run: ./scripts/build_all.sh

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The per-chapter files under book/ are canonical; the single-file book
      # must stay buildable from them.
      - run: ./scripts/build_book.sh
      # The nav footers are generated, so they must match the file order.
      - run: ./scripts/build_book.sh --check-nav
      # The link check below covers the built single file as well as book/, on
      # purpose: a cross-file link the build does not rewrite into an in-page
      # anchor is still a relative link inside build/, where the chapter files
      # do not exist, so only that pass catches it. Fail loudly if the build
      # step above stops producing the artifact.
      - run: test -f build/going-unmanaged.md
      # Alerts and mermaid fences render on GitHub only in a particular shape,
      # and every way of getting it wrong is silent: no build error, no broken
      # link, and a diff that looks fine. Runs after the build so it covers the
      # single file too. Cannot check mermaid grammar - see the script's header.
      - run: ./scripts/check_markup.sh
      # check_markup.sh checks the fence; this checks what is inside it, by
      # drawing every diagram with a real mermaid. Pinned to the major version
      # GitHub itself renders with, so a green run here means what it looks
      # like it means. This install is the slow step in an otherwise ~10s job.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @mermaid-js/mermaid-cli@11
      # --required: without it the script SKIPS when mmdc is missing, which is
      # right on a laptop with no Node and very wrong in CI.
      - run: ./scripts/check_mermaid.sh --required
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline checks relative links and nothing else, so a flaky
          # external site can never fail CI; --include-fragments makes the
          # #chapter-N--title anchors blocking too. The glob picks up every
          # markdown file in the repo plus the build/ artifact.
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true
