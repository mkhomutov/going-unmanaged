name: Release

# A tagged release is an annotated tag plus a CHANGELOG entry; this creates
# the GitHub release page for it. The single-file book that earlier releases
# attached is gone (SITE-PLAN.md, step 2): the book is read as a site now,
# and how a release travels is that plan's open hosting decision.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the release if the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
                 --notes "See CHANGELOG.md for what changed in this release."
