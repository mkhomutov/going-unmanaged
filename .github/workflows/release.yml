name: Release

# The single-file book is a build artifact, not repository content, so every
# tagged release carries it as a download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/build_book.sh
      - name: Attach the single-file book to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
                 --notes "See CHANGELOG.md for what changed in this release."
          gh release upload "$GITHUB_REF_NAME" build/going-unmanaged.md --clobber
