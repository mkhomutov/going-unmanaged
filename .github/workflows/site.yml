name: Site

# Builds the book as a static site and deploys it to GitHub Pages on every
# push to main (and on demand). The repository's Pages setting is "GitHub
# Actions". mermaid-cli is installed so the hook renders every diagram to
# SVG at build time and the published pages fetch nothing from a CDN; the
# strict build that guards the site also runs in ci.yml's `site` job on
# every push and pull request, with the same tool present.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @mermaid-js/mermaid-cli@11
      - run: ./scripts/build_site.sh
      # Every diagram must have been rendered: a fence left for the browser
      # here would mean mmdc was missing, and the published site would fetch
      # from a CDN after all.
      - run: '! grep -rl "language-mermaid\|class=\"mermaid\"" build/site --include=*.html'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@v4
