name: Question
description: A technical question to be answered as a knowledge-base entry.
title: "Q: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Generalise. No product names, identifiers, ticket numbers, dates or
        anything that names where the question came from.
  - type: textarea
    id: question
    attributes:
      label: What I need to know
      description: The question, phrased as if asking cppreference.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What I already tried or read
  - type: input
    id: where
    attributes:
      label: Where it should live
      placeholder: e.g. a Rosetta recipe, Chapter 31, or "new"