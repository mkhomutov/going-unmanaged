name: Question
description: A technical question, answered as a knowledge-base entry (CONTRIBUTING.md, "The Question template").
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Generalise. No product names, identifiers, ticket numbers, dates or
        anything that names where the question came from; open-source
        ecosystems named as study material are fine. Where the answer lands
        is decided by rule, not here: a C# API it maps to makes it a Recipe,
        a symptom on the screen makes it a Finding, anything else an
        Appendix M entry. The `question` label starts the workflow that
        writes it and opens the PR.
  - type: textarea
    id: question
    attributes:
      label: What I need to know
      description: The question, phrased as if asking cppreference.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What I already tried or read
