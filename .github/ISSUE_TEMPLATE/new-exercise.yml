name: New exercise
description: "A new lab or SDK shape, with its reference solution. Known gap: Bestiary Shape 3 — COM-style refcounting — has no lab yet."
labels: ["exercise"]
body:
  - type: markdown
    attributes:
      value: |
        The ground rules are in
        [CONTRIBUTING.md](https://github.com/mkhomutov/going-unmanaged/blob/main/CONTRIBUTING.md#ground-rules-ci-enforces-the-first-one)
        and they are structural: solutions use the standard library only;
        vendor-style `Fake*` code freezes once its contract is quoted in the
        book (changing it means changing the chapter in the same commit); and
        everything verifiable is wired into `scripts/build_all.sh`, which must
        print **ALL GREEN**. *Where chapter code lives*, in the same file, says
        where the files go.

        The review bar for the material itself is
        [the questions in CONTRIBUTING.md](https://github.com/mkhomutov/going-unmanaged/blob/main/CONTRIBUTING.md#the-questions-every-piece-of-material-answers)
        — for an exercise, the sharp ones are 5 and 6: build it so the natural
        C# move *is* the trap, and know which tool names the failure.
  - type: textarea
    id: shape
    attributes:
      label: The proposed SDK shape or lab
      description: What vendor idiom does it model, and what does the reader actually build?
    validations:
      required: true
  - type: input
    id: trains
    attributes:
      label: What it trains
      description: Which chapter — or Bestiary shape — does this exercise give hands-on practice for?
      placeholder: e.g. Bestiary Shape 3 (Chapter 16)
    validations:
      required: true
  - type: textarea
    id: sketch
    attributes:
      label: Sketch (optional)
      description: Task-card outline, the vendor header's surface, the pitfalls you would expect the reader to hit.
  - type: textarea
    id: questions
    attributes:
      label: Against the questions (optional here, required of the PR)
      description: Which C# reflex is the trap — the exercise should be built so the natural C# move is the bug — which tool names the failure when the reader hits it, and what Habit line survives. A sketch is enough at issue stage; the full walk happens at PR review.
