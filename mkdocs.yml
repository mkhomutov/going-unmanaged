# The book as a static site. scripts/build_site.sh builds it; SITE-PLAN.md is
# the plan it serves. docs_dir is book/ itself - the same files GitHub renders,
# with nothing copied or generated - and the hooks file supplies the nav and
# the alert-to-admonition translation, so this file stays declarative.
site_name: Going Unmanaged
site_description: A hands-on C++ handbook for C# developers
site_url: https://mkhomutov.github.io/going-unmanaged/
repo_url: https://github.com/mkhomutov/going-unmanaged
edit_uri: edit/main/book/
copyright: Text CC-BY 4.0, code MIT
docs_dir: book
site_dir: build/site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

hooks:
  - scripts/site_hooks.py

plugins:
  # Tuned against this corpus, and held to a fixture by
  # scripts/check_search.sh: the numbers below are that fixture's, and every
  # clause here earned its place by moving it. The separator is Material's
  # own recommendation for code-heavy documentation MINUS its camelCase
  # clause. Splitting on punctuation is what makes `std::optional`,
  # `vector::reserve` and `Path.Combine` findable by either half, and it is
  # worth 3 of the 53 queries. Splitting camelCase costs more than it pays
  # here, because in a book written for C# developers the identifiers readers
  # type ARE camelCase: with it, `FileSystemWatcher` becomes `File System
  # Watcher` and lands on Chapter 26's build systems instead of Recipe 40.
  # `_` is left alone for the same reason at the other end of the alphabet -
  # `unique_ptr` and `push_back` are names, not two words.
  #
  # The pipeline stays Material's default, written down rather than inherited
  # so that a default change is a visible diff. Adding the stemmer looks
  # obvious and is wrong: Material appends a wildcard to every term, lunr
  # skips the pipeline for a wildcard term, and the index would hold `reserv`
  # while the query asked for `reserve*` - which matches nothing. Measured,
  # not reasoned: turning the stemmer on costs 18 of the 53 queries.
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
      pipeline:
        - stopWordFilter

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
      # GitHub's slugs, including the double dash after "Chapter N", so every
      # ](file.md#chapter-n--title) link in book/ resolves unchanged.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Include-from-file, the mechanism SITE-PLAN.md's step 4 moves the
      # quoted listings onto: `--8<-- "exercises/cookbook/files.cpp:recipe-1"`
      # names a section fenced in the source by `// --8<-- [start:recipe-1]`
      # and `[end:recipe-1]` comments. Never a line range: check_paths only
      # proves the range exists, not that it still holds the function.
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Strict mode turns every one of these into a build failure.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
